services:
  gateway:
    build:
      context: .
      dockerfile: services/agent-gateway/Dockerfile
      args:
        # 默认值与 Dockerfile / `.bun-version` 对齐（`bun run check:docker-versions`
        # 校验漂移）；发布流水线通过同名环境变量注入真实版本。
        BUN_VERSION: ${BUN_VERSION:-1.4.2}
        NODE_VERSION: ${NODE_VERSION:-22}
        OPENAWORK_VERSION: ${OPENAWORK_VERSION:-dev}
        OPENAWORK_GIT_SHA: ${OPENAWORK_GIT_SHA:-unknown}
    ports:
      - '3000:3000'
    environment:
      GATEWAY_PORT: 3000
      GATEWAY_HOST: 0.0.0.0
      JWT_SECRET: change-me-in-production-min-32-chars
      JWT_EXPIRES_IN: 15m
      OPENAWORK_DATA_DIR: /var/lib/openawork
      # 浏览器实时预览（跨域页面也能采集控制台与网络）。
      # 默认关闭；开启前需保证容器内有 Chromium（系统 Chrome/Edge，或 npx playwright install chromium），
      # 否则 /browser-live/status 返回 browser-missing，前端回退 iframe 预览。
      # OPENAWORK_BROWSER_LIVE: '1'
      # 若确实要连 Agent 的桌面自动化工具一起开（会多暴露 goto/click/type 等工具），再叠加：
      # DESKTOP_AUTOMATION: '1'
      # 网关使用 fake-IP DNS（Clash/规则代理，域名解析到 198.18.0.0/15）时，
      # open_websearch 抓取会被判为私有网络而拒绝；按需放开该段：
      # FAKE_IP_CIDRS: '198.18.0.0/15'
    volumes:
      - gateway_data:/var/lib/openawork

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - gateway

# 本栈不含 Redis：网关当前不连接真实 Redis（进程内 Map 桩，见
# services/agent-gateway/src/infra/db.ts），REDIS_URL 仅用于终端面板的端口过滤。
# 未来做多实例部署、真正接入 Redis 适配后，再在此追加 redis 服务与 depends_on。

volumes:
  gateway_data:

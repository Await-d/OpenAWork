name: Release Desktop

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Update channel'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - stable
      release_notes_body:
        description: '完整发布稿正文（手动触发时必填；标准流程由 Prepare Release 自动传入）'
        required: true
        type: string

jobs:
  resolve-release-notes:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      release_channel: ${{ steps.meta.outputs.release_channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Materialize release notes body
        env:
          RELEASE_NOTES_BODY: ${{ github.event.inputs.release_notes_body || '' }}
        run: |
          if [[ -n "$RELEASE_NOTES_BODY" ]]; then
            printf '%s' "$RELEASE_NOTES_BODY" > release-notes.md
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
          else
            echo "release_notes_body is required when not running from a tag ref."
            exit 1
          fi

      - name: Enrich manual release notes body
        if: ${{ github.ref_type != 'tag' }}
        run: |
          TARGET="desktop-preview"
          if [[ "${{ inputs.channel }}" == "stable" ]]; then
            TARGET="desktop-stable"
          fi

          node scripts/release/release-notes.mjs enrich \
            --body-file release-notes.md \
            --target "$TARGET" \
            --output-file release-notes.md

      - name: Validate release notes body
        run: node scripts/release/release-notes.mjs inspect --body-file release-notes.md

      - name: Resolve desktop release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION=$(node -e "const match = /desktop-v(\d+\.\d+\.\d+)(-preview)?$/.exec(process.env.GITHUB_REF_NAME || ''); if (!match) process.exit(1); process.stdout.write(match[1]);")
            CHANNEL=$([[ "${GITHUB_REF_NAME}" == *-preview ]] && printf 'preview' || printf 'stable')
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
            CHANNEL="${{ inputs.channel }}"
            RELEASE_TAG="desktop-v${VERSION}"
            if [[ "$CHANNEL" == "preview" ]]; then
              RELEASE_TAG="desktop-v${VERSION}-preview"
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=OpenAWork Desktop ${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-notes
          path: release-notes.md

  build:
    name: Build ${{ matrix.label }}
    needs: resolve-release-notes
    permissions:
      contents: write
    env:
      TAURI_SCRIPT: pnpm --filter @openAwork/desktop exec tauri
      TAURI_LINUX_AYATANA_APPINDICATOR: '0'
      MACOS_CODESIGN_READY: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
      MACOS_NOTARIZATION_READY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-aarch64
            runner: macos-latest
            args: '--target aarch64-apple-darwin --bundles app,dmg'
            rust_targets: 'aarch64-apple-darwin'
            tauri_target_triple: 'aarch64-apple-darwin'
            optional: false
            bundle_path: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/
          - label: macos-x86_64
            runner: macos-13
            args: '--target x86_64-apple-darwin --bundles app,dmg'
            rust_targets: 'x86_64-apple-darwin'
            tauri_target_triple: 'x86_64-apple-darwin'
            optional: false
            bundle_path: apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/
          - label: windows-x86_64
            runner: windows-latest
            args: '--bundles nsis'
            rust_targets: ''
            tauri_target_triple: ''
            optional: false
            bundle_path: apps/desktop/src-tauri/target/release/bundle/
          - label: windows-aarch64
            # 必须用原生 ARM runner：x64 上 Bun 交叉编译 windows-aarch64 runtime
            # 会稳定失败（Failed to extract executable）。
            runner: windows-11-arm
            args: '--bundles nsis'
            rust_targets: ''
            tauri_target_triple: ''
            # ARM runner 在部分 org/plan 上可能不可用；失败不阻断主渠道
            optional: true
            bundle_path: apps/desktop/src-tauri/target/release/bundle/
          - label: linux-x86_64
            runner: ubuntu-22.04
            args: '--verbose'
            rust_targets: ''
            tauri_target_triple: ''
            optional: false
            bundle_path: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/deb/*.sig
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/appimage/*.sig
              apps/desktop/src-tauri/target/release/bundle/appimage/*.tar.gz
              apps/desktop/src-tauri/target/release/bundle/appimage/*.json
          - label: linux-aarch64
            # 必须用原生 ARM runner：x64 交叉编译能产出 .deb，但 AppImage 依赖
            # linuxdeploy-aarch64.AppImage，在 x64 上执行会 Exec format error。
            runner: ubuntu-22.04-arm
            args: '--verbose'
            rust_targets: ''
            tauri_target_triple: ''
            optional: true
            bundle_path: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/deb/*.sig
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/appimage/*.sig
              apps/desktop/src-tauri/target/release/bundle/appimage/*.tar.gz
              apps/desktop/src-tauri/target/release/bundle/appimage/*.json
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-notes
          path: temp/release-notes

      - name: Install Linux system deps
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            desktop-file-utils \
            file \
            libdbus-1-dev \
            libglib2.0-dev \
            libappindicator3-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libfuse2 \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            pkg-config \
            fakeroot \
            patchelf \
            squashfs-tools \
            appstream \
            wget \
            xdg-utils
          # linuxdeploy AppImage 在部分 runner 上会调用 xdg-open；
          # ARM 镜像默认不带 xdg-utils，缺了会在 bundling 阶段直接失败：
          #   xdg-open binary not found /usr/bin/xdg-open
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      # 已改为原生 ARM runner，不再做 x64→arm64 交叉编译依赖安装。

      - name: Verify Linux desktop deps
        if: startsWith(matrix.runner, 'ubuntu-')
        shell: bash
        run: |
          set -o pipefail
          node apps/desktop/src-tauri/scripts/check-build-deps.mjs 2>&1 | tee "$RUNNER_TEMP/linux-deps-check.log"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build gateway sidecar
        shell: bash
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.tauri_target_triple }}
        run: node apps/desktop/src-tauri/scripts/bundle-sidecar.mjs

      - name: Import macOS signing cert
        if: startsWith(matrix.runner, 'macos-') && env.MACOS_CODESIGN_READY == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Read release notes body from repository
        id: notes_body
        shell: bash
        run: |
          NOTES_FILE="temp/release-notes/release-notes.md"
          DELIMITER=$(node -e "process.stdout.write('EOF_' + Math.random().toString(16).slice(2))")
          echo "notes<<${DELIMITER}" >> "$GITHUB_OUTPUT"
          cat "$NOTES_FILE" >> "$GITHUB_OUTPUT"
          printf '\n' >> "$GITHUB_OUTPUT"
          echo "${DELIMITER}" >> "$GITHUB_OUTPUT"

      - name: Normalize Tauri updater signing key
        shell: bash
        env:
          RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const normalizeNewlines = (value) =>
            value.replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\\n/g, '\n').trim();

          const hasTauriKeyShape = (value) =>
            value.includes('untrusted comment:') && value.includes('trusted comment:');

          let key = normalizeNewlines(process.env.RAW_TAURI_SIGNING_PRIVATE_KEY || '');
          const password = process.env.RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '';

          if (!key) {
            console.error('Missing GitHub secret TAURI_SIGNING_PRIVATE_KEY.');
            process.exit(1);
          }

          if (!hasTauriKeyShape(key)) {
            const compact = key.replace(/\s+/g, '');
            const decoded = normalizeNewlines(Buffer.from(compact, 'base64').toString('utf8'));
            if (hasTauriKeyShape(decoded)) {
              key = decoded;
            }
          }

          if (!hasTauriKeyShape(key)) {
            console.error('GitHub secret TAURI_SIGNING_PRIVATE_KEY is not a Tauri updater private key.');
            console.error('It must be the private key text generated by `tauri signer generate`, including the `untrusted comment:` and `trusted comment:` lines.');
            console.error('If you store it as base64, encode that full multi-line Tauri key text, not a PEM/OpenSSL key.');
            process.exit(1);
          }

          for (const line of key.split('\n')) {
            if (line) {
              console.log(`::add-mask::${line}`);
            }
          }
          if (password) {
            console.log(`::add-mask::${password}`);
          }

          const encodedKey = Buffer.from(key, 'utf8').toString('base64');
          console.log(`::add-mask::${encodedKey}`);

          const keyDelimiter = `TAURI_SIGNING_PRIVATE_KEY_${Date.now()}`;
          const passwordDelimiter = `TAURI_SIGNING_PRIVATE_KEY_PASSWORD_${Date.now()}`;
          fs.appendFileSync(process.env.GITHUB_ENV, `TAURI_SIGNING_PRIVATE_KEY<<${keyDelimiter}\n${encodedKey}\n${keyDelimiter}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<${passwordDelimiter}\n${password}\n${passwordDelimiter}\n`);
          NODE

      - name: Build Tauri app (default)
        if: startsWith(matrix.runner, 'windows-') || (startsWith(matrix.runner, 'macos-') && env.MACOS_CODESIGN_READY != 'true')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAWORK_SKIP_SIDECAR_BUNDLE: '1'
          NODE_OPTIONS: '--max-old-space-size=6144'
        with:
          projectPath: apps/desktop
          tauriScript: ${{ env.TAURI_SCRIPT }}
          args: ${{ matrix.args }}
          tagName: ${{ needs.resolve-release-notes.outputs.release_tag }}
          releaseName: ${{ needs.resolve-release-notes.outputs.release_name }}
          releaseBody: ${{ steps.notes_body.outputs.notes || inputs.channel }}
          releaseDraft: false
          prerelease: ${{ needs.resolve-release-notes.outputs.release_channel == 'preview' }}
          includeUpdaterJson: true

      - name: Build Tauri app (Linux)
        if: startsWith(matrix.runner, 'ubuntu-')
        shell: bash
        env:
          DEPLOY_GTK_VERSION: '3'
          OPENAWORK_SKIP_SIDECAR_BUNDLE: '1'
          NODE_OPTIONS: '--max-old-space-size=6144'
          TARGET_FLAG: ${{ matrix.tauri_target_triple && format('--target {0}', matrix.tauri_target_triple) || '' }}
        run: |
          set -euo pipefail
          DEB_LOG="$RUNNER_TEMP/tauri-linux-deb.log"
          APPIMAGE_STATUS="$RUNNER_TEMP/tauri-linux-appimage-status.txt"
          APPIMAGE_DIAGNOSTICS="$RUNNER_TEMP/tauri-linux-appimage-diagnostics.md"

          pnpm --filter @openAwork/desktop exec tauri build --bundles deb $TARGET_FLAG --verbose 2>&1 | tee "$DEB_LOG"

          if pnpm --filter @openAwork/desktop exec tauri build --bundles appimage $TARGET_FLAG --verbose; then
            echo 'success' > "$APPIMAGE_STATUS"
          else
            appimage_status=$?
            echo "failure:$appimage_status" > "$APPIMAGE_STATUS"
            {
              echo '### Linux AppImage 打包警告'
              echo
              echo "AppImage 打包失败，退出码：$appimage_status。Tauri updater 的 Linux 自动更新需要 AppImage 资产。"
            } > "$APPIMAGE_DIAGNOSTICS"
            echo '::error::Linux AppImage 打包失败；Tauri updater 需要 AppImage 更新资产。'
            exit "$appimage_status"
          fi

          APPIMAGE_DIR="apps/desktop/src-tauri/target/${{ matrix.tauri_target_triple && format('{0}/', matrix.tauri_target_triple) || '' }}release/bundle/appimage"
          find "$APPIMAGE_DIR" -maxdepth 1 -name '*.AppImage.sig' -print -quit | grep -q . || {
            echo 'Missing Linux updater signature (*.AppImage.sig).' >&2
            exit 1
          }

      - name: Summarize Linux Tauri build failure
        if: failure() && startsWith(matrix.runner, 'ubuntu-')
        shell: bash
        run: |
          {
            echo '## Linux desktop build failure'
            for LOG in "$RUNNER_TEMP/linux-deps-check.log" "$RUNNER_TEMP/tauri-linux-deb.log"; do
              echo
              echo "### $(basename "$LOG")"
              echo '```text'
              if [ -f "$LOG" ]; then
                tail -n 200 "$LOG"
              else
                echo "$(basename "$LOG") was not created."
              fi
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize optional Linux AppImage failure
        if: startsWith(matrix.runner, 'ubuntu-')
        shell: bash
        run: |
          STATUS="$RUNNER_TEMP/tauri-linux-appimage-status.txt"
          DIAGNOSTICS="$RUNNER_TEMP/tauri-linux-appimage-diagnostics.md"
          if [ -f "$STATUS" ] && grep -q '^failure:' "$STATUS" && [ -f "$DIAGNOSTICS" ]; then
            cat "$DIAGNOSTICS" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Linux build logs
        if: always() && startsWith(matrix.runner, 'ubuntu-')
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-build-logs
          path: |
            ${{ runner.temp }}/linux-deps-check.log
            ${{ runner.temp }}/tauri-linux-deb.log
            ${{ runner.temp }}/tauri-linux-appimage-status.txt
            ${{ runner.temp }}/tauri-linux-appimage-diagnostics.md
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Linux installers to GitHub release
        if: startsWith(matrix.runner, 'ubuntu-')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          release_tag='${{ needs.resolve-release-notes.outputs.release_tag }}'
          release_name='${{ needs.resolve-release-notes.outputs.release_name }}'
          release_flags=()
          if [ '${{ needs.resolve-release-notes.outputs.release_channel }}' = 'preview' ]; then
            release_flags+=(--prerelease)
          fi

          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" \
              --title "$release_name" \
              --notes-file temp/release-notes/release-notes.md \
              "${release_flags[@]}"
          fi

          upload=()
          target_dir='apps/desktop/src-tauri/target/${{ matrix.tauri_target_triple || '' }}/'
          # Normalize: remove trailing double slash when tauri_target_triple is empty
          target_dir="${target_dir//\/\//\/}"
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            for file in $pattern; do
              [ -f "$file" ] || continue
              upload+=("$file")
            done
          done <<EOF
          ${target_dir}release/bundle/deb/*.deb
          ${target_dir}release/bundle/deb/*.sig
          ${target_dir}release/bundle/appimage/*.AppImage
          ${target_dir}release/bundle/appimage/*.sig
          ${target_dir}release/bundle/appimage/*.tar.gz
          ${target_dir}release/bundle/appimage/*.json
          EOF

          deduped=()
          for file in "${upload[@]}"; do
            skip='false'
            for existing in "${deduped[@]}"; do
              if [ "$existing" = "$file" ]; then
                skip='true'
                break
              fi
            done
            if [ "$skip" = 'false' ]; then
              deduped+=("$file")
            fi
          done

          if [ "${#deduped[@]}" -eq 0 ]; then
            echo 'No Linux installer assets found.' >&2
            exit 1
          fi

          gh release upload "$release_tag" "${deduped[@]}" --clobber

      - name: Build Tauri app (macOS signed)
        if: startsWith(matrix.runner, 'macos-') && env.MACOS_CODESIGN_READY == 'true' && env.MACOS_NOTARIZATION_READY != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAWORK_SKIP_SIDECAR_BUNDLE: '1'
          NODE_OPTIONS: '--max-old-space-size=6144'
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: apps/desktop
          tauriScript: ${{ env.TAURI_SCRIPT }}
          args: ${{ matrix.args }}
          tagName: ${{ needs.resolve-release-notes.outputs.release_tag }}
          releaseName: ${{ needs.resolve-release-notes.outputs.release_name }}
          releaseBody: ${{ steps.notes_body.outputs.notes || inputs.channel }}
          releaseDraft: false
          prerelease: ${{ needs.resolve-release-notes.outputs.release_channel == 'preview' }}
          includeUpdaterJson: true

      - name: Build Tauri app (macOS signed + notarized)
        if: startsWith(matrix.runner, 'macos-') && env.MACOS_CODESIGN_READY == 'true' && env.MACOS_NOTARIZATION_READY == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAWORK_SKIP_SIDECAR_BUNDLE: '1'
          NODE_OPTIONS: '--max-old-space-size=6144'
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: ${{ env.TAURI_SCRIPT }}
          args: ${{ matrix.args }}
          tagName: ${{ needs.resolve-release-notes.outputs.release_tag }}
          releaseName: ${{ needs.resolve-release-notes.outputs.release_name }}
          releaseBody: ${{ steps.notes_body.outputs.notes || inputs.channel }}
          releaseDraft: false
          prerelease: ${{ needs.resolve-release-notes.outputs.release_channel == 'preview' }}
          includeUpdaterJson: true

      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers-${{ matrix.label }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: ${{ matrix.optional == true && 'warn' || 'error' }}
          retention-days: 14

  publish-release-notes:
    name: Publish Aggregate Release Summary
    runs-on: ubuntu-latest
    needs: [resolve-release-notes, build]
    if: ${{ always() && needs.resolve-release-notes.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-notes
          path: temp/release-notes

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: linux-desktop-build-logs
          path: temp/linux-build-logs

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Resolve desktop release state
        id: release_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${{ needs.resolve-release-notes.outputs.release_tag }}" > release.json 2>/dev/null; then
            echo "release_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_found=false" >> "$GITHUB_OUTPUT"
            printf '{}\n' > release.json
          fi

      - name: Build desktop release summary
        env:
          NOTES_FILE: temp/release-notes/release-notes.md
        run: |
          node scripts/release/release-result-summary.mjs print \
            --target desktop \
            --base-file "$NOTES_FILE" \
            --input-file release.json \
            --version "${{ needs.resolve-release-notes.outputs.release_tag }}" \
            --channel "${{ needs.resolve-release-notes.outputs.release_channel }}" \
            --output-file release-body-final.md >/dev/null

      - name: Publish updater JSON
        if: ${{ needs.build.result == 'success' && steps.release_state.outputs.release_found == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${{ needs.resolve-release-notes.outputs.release_tag }}" > release.json
          node scripts/build/build-tauri-updater-json.mjs \
            --input-file release.json \
            --output-file latest.json \
            --notes-file temp/release-notes/release-notes.md \
            --version "${{ needs.resolve-release-notes.outputs.version }}" \
            --required-platform linux-x86_64 \
            --required-platform windows-x86_64 \
            --required-platform darwin-aarch64 \
            --required-platform darwin-x86_64
          gh release upload "${{ needs.resolve-release-notes.outputs.release_tag }}" latest.json --clobber

      - name: Publish proxied updater JSON for China users
        if: ${{ needs.build.result == 'success' && steps.release_state.outputs.release_found == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate latest-cn.json with download URLs routed through gh.llkk.cc proxy
          node scripts/build/build-tauri-updater-json.mjs \
            --input-file release.json \
            --output-file latest-cn.json \
            --notes-file temp/release-notes/release-notes.md \
            --version "${{ needs.resolve-release-notes.outputs.version }}" \
            --required-platform linux-x86_64 \
            --required-platform windows-x86_64 \
            --required-platform darwin-aarch64 \
            --required-platform darwin-x86_64 \
            --proxy-prefix 'https://gh.llkk.cc/'
          gh release upload "${{ needs.resolve-release-notes.outputs.release_tag }}" latest-cn.json --clobber

      # 把 latest.json 镜像到滚动 tag `desktop-latest-preview`，让 tauri.conf.json
      # 里固定的 endpoint URL 始终能拿到最新 preview 元数据；同时把它覆盖回所有
      # 历史 `desktop-v*-preview` release，让仍持有旧 endpoint URL（曾经用过
      # `{{current_version}}` 模板）的存量客户端也能升上来——它们只能查到自己版本号
      # 对应的 release URL，所以必须把最新 latest.json 写到那里。
      - name: Mirror updater JSON to rolling preview tag (preview channel)
        if: ${{ needs.build.result == 'success' && steps.release_state.outputs.release_found == 'true' && needs.resolve-release-notes.outputs.release_channel == 'preview' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rolling_tag='desktop-latest-preview'
          if ! gh release view "$rolling_tag" >/dev/null 2>&1; then
            gh release create "$rolling_tag" \
              --title 'OpenAWork Desktop Preview (rolling latest)' \
              --notes '此 release 由 release-desktop.yml 自动维护，资产 latest.json 始终指向最新 preview 版本，供 Tauri updater 拉取。请勿手动修改。' \
              --prerelease
          fi
          gh release upload "$rolling_tag" latest.json latest-cn.json --clobber

      - name: Backfill updater JSON to historical preview releases
        if: ${{ needs.build.result == 'success' && steps.release_state.outputs.release_found == 'true' && needs.resolve-release-notes.outputs.release_channel == 'preview' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ needs.resolve-release-notes.outputs.release_tag }}
        run: |
          set -euo pipefail
          # gh release list 只返回最近 N 条；--limit 100 足够覆盖历史 preview。
          mapfile -t historical_tags < <(
            gh release list --limit 100 --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease == true) | select(.tagName | test("^desktop-v[0-9]+\\.[0-9]+\\.[0-9]+-preview$")) | .tagName'
          )
          for tag in "${historical_tags[@]}"; do
            if [ "$tag" = "$CURRENT_TAG" ]; then
              continue
            fi
            echo "Backfilling latest.json + latest-cn.json to $tag"
            if ! gh release upload "$tag" latest.json latest-cn.json --clobber; then
              echo "::warning::Failed to backfill updater JSON to $tag (release may have been deleted)"
            fi
          done

      - name: Append Linux build diagnostics
        shell: bash
        run: |
          BUILD_RESULT='${{ needs.build.result }}'
          APPIMAGE_STATUS='temp/linux-build-logs/tauri-linux-appimage-status.txt'
          SHOULD_APPEND=false

          if [ "$BUILD_RESULT" != 'success' ]; then
            SHOULD_APPEND=true
          elif [ -f "$APPIMAGE_STATUS" ] && grep -q '^failure:' "$APPIMAGE_STATUS"; then
            SHOULD_APPEND=true
          fi

          if [ "$SHOULD_APPEND" = true ] && [ -d temp/linux-build-logs ]; then
            {
              echo
              echo '## Linux build diagnostics'
              if [ -f "$APPIMAGE_STATUS" ] && grep -q '^failure:' "$APPIMAGE_STATUS"; then
                echo
                echo '> Linux AppImage 是 Tauri updater 的 Linux 自动更新资产；失败时本次桌面发布不会继续产出有效 updater JSON。'
                if [ -f temp/linux-build-logs/tauri-linux-appimage-diagnostics.md ]; then
                  echo
                  cat temp/linux-build-logs/tauri-linux-appimage-diagnostics.md
                fi
              fi
              for LOG in temp/linux-build-logs/*; do
                [ -f "$LOG" ] || continue
                case "$(basename "$LOG")" in
                  tauri-linux-appimage-status.txt|tauri-linux-appimage-diagnostics.md) continue ;;
                esac
                echo
                echo "### $(basename "$LOG")"
                echo '```text'
                tail -n 200 "$LOG"
                echo '```'
              done
            } >> release-body-final.md
          fi

      - name: Build desktop aggregate summary
        env:
          NOTES_FILE: temp/release-notes/release-notes.md
        run: |
          node scripts/release/release-aggregate-summary.mjs print \
            --base-file "$NOTES_FILE" \
            --desktop-file release-body-final.md \
            --version "${{ needs.resolve-release-notes.outputs.version }}" \
            --output-file release-aggregate-summary.md >/dev/null

      - name: Append desktop aggregate summary to workflow summary
        run: cat release-aggregate-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload desktop release summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-summary
          path: release-body-final.md

      - name: Upload aggregate release summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aggregate-summary
          path: release-aggregate-summary.md

      - name: Update GitHub release body
        if: ${{ steps.release_state.outputs.release_found == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.resolve-release-notes.outputs.release_tag }}" --notes-file release-aggregate-summary.md

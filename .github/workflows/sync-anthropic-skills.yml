name: Sync Anthropic Skills

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: sync-anthropic-skills
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run sync script
        run: bash scripts/sync-anthropic-skills.sh

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain packages/resources/resources/skills/reference/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read sync manifest
        if: steps.changes.outputs.changed == 'true'
        id: manifest
        run: |
          COMMIT=$(jq -r '.commit' packages/resources/resources/skills/reference/.anthropic-sync.json)
          SHORT="${COMMIT:0:12}"
          echo "commit=$SHORT" >> "$GITHUB_OUTPUT"
          SKILLS=$(jq -r '.skills | join(", ")' packages/resources/resources/skills/reference/.anthropic-sync.json)
          echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/resources/resources/skills/reference/
          git commit -m "release(skills): 同步 Anthropic skills（${{ steps.manifest.outputs.commit }}）"
          git push origin HEAD:main

      - name: Write job summary
        if: always()
        env:
          HAS_CHANGES: ${{ steps.changes.outputs.changed }}
          COMMIT: ${{ steps.manifest.outputs.commit }}
          SKILLS: ${{ steps.manifest.outputs.skills }}
        run: |
          if [ "$HAS_CHANGES" = "true" ]; then
            echo "## ✅ Anthropic Skills 同步完成" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| 项目 | 值 |" >> "$GITHUB_STEP_SUMMARY"
            echo "|------|-----|" >> "$GITHUB_STEP_SUMMARY"
            echo "| 上游 commit | \`$COMMIT\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 同步 skills | $SKILLS |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "已推送到 main，CI 通过后将自动触发构建发布。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ⏭ 无更新" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Anthropic skills 仓库无变更，跳过同步。" >> "$GITHUB_STEP_SUMMARY"
          fi

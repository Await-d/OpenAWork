<!doctype html>
<html lang="zh-CN" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>方案 C · 概览 + 任务卡片网格 · 定时任务布局候选</title>
    <link rel="stylesheet" href="./shared.css" />
    <style>
      .kpi-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }

      .kpi {
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .kpi-label {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--fg-subtle);
      }

      .kpi-value {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        display: flex;
        align-items: baseline;
        gap: 6px;
      }

      .kpi-value small {
        font-size: 11px;
        font-weight: 500;
        color: var(--fg-muted);
      }

      .kpi-note {
        font-size: 11px;
        color: var(--fg-muted);
      }

      .alert-card {
        padding: 12px 14px;
      }

      .alert-head {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 650;
        color: var(--complement);
      }

      .alert-list {
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .alert-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 12px;
      }

      .filter-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 12px;
        align-items: start;
      }

      .job-card {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        position: relative;
        overflow: hidden;
        transition:
          border-color 120ms ease,
          transform 120ms ease;
      }

      .job-card:hover {
        border-color: var(--border-emphasis);
        transform: translateY(-1px);
      }

      .job-card[data-disabled='true'] {
        opacity: 0.72;
      }

      .job-card[data-running='true']::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 2px;
        width: 40%;
        background: linear-gradient(90deg, transparent, var(--contrast), transparent);
        animation: sweep 1.6s linear infinite;
      }

      @keyframes sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(320%);
        }
      }

      .card-top {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }

      .card-name {
        font-size: 13.5px;
        font-weight: 650;
        line-height: 1.35;
        word-break: break-word;
      }

      .card-prompt {
        margin-top: 3px;
        font-size: 11.5px;
        color: var(--fg-muted);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .countdown {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        background: var(--bg-base);
        border: 1px solid var(--border-default);
      }

      .countdown-value {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .countdown-note {
        font-size: 11px;
        color: var(--fg-muted);
      }

      .card-meta {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px 12px;
        font-size: 11.5px;
      }

      .card-meta span.muted {
        display: block;
        font-size: 10.5px;
        margin-bottom: 2px;
      }

      .card-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        border-top: 1px solid var(--border-default);
        padding-top: 10px;
      }

      .card-history {
        border-top: 1px dashed var(--border-emphasis);
        padding-top: 10px;
        display: none;
        flex-direction: column;
        gap: 8px;
      }

      .job-card[data-history='true'] .card-history {
        display: flex;
      }

      .tl-entry {
        border-left: 2px solid var(--border-emphasis);
        padding-left: 10px;
        font-size: 11.5px;
      }

      .tl-line {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .tl-output,
      .tl-error {
        margin-top: 4px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .tl-output {
        color: var(--fg-default);
        background: var(--bg-base);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-sm);
        padding: 7px 9px;
        max-height: 130px;
        overflow: auto;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 68px;
        transform: translateX(-50%) translateY(8px);
        background: var(--bg-elevated);
        border: 1px solid var(--accent-border);
        color: var(--fg-strong);
        border-radius: 999px;
        padding: 7px 14px;
        font-size: 12px;
        box-shadow: var(--shadow-md);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 160ms ease,
          transform 160ms ease;
        z-index: 60;
      }

      .toast[data-show='true'] {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="page-root">
      <header class="page-header">
        <span class="page-title">定时任务</span>
        <span class="page-subtitle">概览优先：每张卡一个任务，状态与下次执行一眼可见</span>
        <span class="spacer"></span>
        <button type="button" class="btn btn-accent" data-action="新建任务">+ 添加任务</button>
      </header>

      <main class="page-content">
        <div class="page-inner">
          <div class="kpi-row" id="kpis"></div>

          <div class="card alert-card" id="alert-card" hidden></div>

          <div class="filter-bar">
            <input
              type="search"
              id="q"
              placeholder="搜索任务名 / 提示词…"
              style="min-width: 240px"
            />
            <div id="filter-chips" style="display: flex; gap: 6px; flex-wrap: wrap">
              <button type="button" class="chip" data-filter="all" aria-pressed="true">全部</button>
              <button type="button" class="chip" data-filter="enabled" aria-pressed="false">
                已启用
              </button>
              <button type="button" class="chip" data-filter="running" aria-pressed="false">
                运行中
              </button>
              <button type="button" class="chip" data-filter="disabled" aria-pressed="false">
                已停用
              </button>
            </div>
            <span class="spacer"></span>
            <select id="sort" aria-label="排序">
              <option value="next">按下次执行时间</option>
              <option value="name">按名称</option>
              <option value="fires">按运行次数</option>
            </select>
          </div>

          <div class="grid" id="grid"></div>
        </div>
      </main>
    </div>

    <div class="toast" id="toast"></div>

    <script src="./demo-core.js"></script>
    <script>
      (function () {
        var sd = window.SD;
        var state = { keyword: '', filter: 'all', sort: 'next', openHistory: {} };

        function todayJobs() {
          return sd.jobs.filter(function (job) {
            if (job.status === 'disabled' || !job.nextFireAt) return false;
            return sd.clockTime(job.nextFireAt) !== '—' && sd.dayLabel(job.nextFireAt) === '今天';
          });
        }

        function renderKpis() {
          var enabled = sd.jobs.filter(function (job) {
            return job.status === 'enabled';
          }).length;
          var running = sd.jobs.filter(function (job) {
            return job.running;
          }).length;
          var failed = sd.jobs.filter(function (job) {
            return job.lastResult === 'failed';
          }).length;
          var today = todayJobs();

          document.getElementById('kpis').innerHTML =
            '<div class="card kpi"><span class="kpi-label">任务总数</span><span class="kpi-value">' +
            sd.jobs.length +
            '<small>条</small></span><span class="kpi-note">' +
            sd.jobs.filter(function (job) {
              return job.kind === 'at';
            }).length +
            ' 条为单次任务</span></div>' +
            '<div class="card kpi"><span class="kpi-label">启用中</span><span class="kpi-value" style="color:var(--success)">' +
            enabled +
            '<small>条</small></span><span class="kpi-note">' +
            running +
            ' 条正在执行</span></div>' +
            '<div class="card kpi"><span class="kpi-label">今日还将执行</span><span class="kpi-value" style="color:var(--accent)">' +
            today.length +
            '<small>次</small></span><span class="kpi-note">' +
            (today[0]
              ? '最近：' + sd.escapeHtml(today[0].name) + ' ' + sd.clockTime(today[0].nextFireAt)
              : '今天没有待执行任务') +
            '</span></div>' +
            '<div class="card kpi"><span class="kpi-label">最近失败</span><span class="kpi-value" style="color:' +
            (failed ? 'var(--complement)' : 'var(--fg-strong)') +
            '">' +
            failed +
            '<small>条</small></span><span class="kpi-note">' +
            (failed ? '需人工确认产出' : '最近一轮全部正常') +
            '</span></div>';

          var alertCard = document.getElementById('alert-card');
          var failures = sd.jobs.filter(function (job) {
            return job.lastResult === 'failed';
          });
          if (failures.length === 0) {
            alertCard.hidden = true;
          } else {
            alertCard.hidden = false;
            alertCard.innerHTML =
              '<div class="alert-head">⚠ ' +
              failures.length +
              ' 个任务最近一次执行失败</div><div class="alert-list">' +
              failures
                .map(function (job) {
                  return (
                    '<div class="alert-row"><strong>' +
                    sd.escapeHtml(job.name) +
                    '</strong><span class="muted">' +
                    sd.absTime(job.lastFiredAt) +
                    '</span><span class="muted" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
                    sd.escapeHtml(job.lastError || '未记录失败原因') +
                    '</span><button type="button" class="btn" data-action="立即重跑：' +
                    sd.escapeHtml(job.name) +
                    '">立即重跑</button></div>'
                  );
                })
                .join('') +
              '</div>';
          }
        }

        function filtered() {
          var list = sd.jobs.filter(function (job) {
            if (state.filter === 'enabled' && job.status !== 'enabled') return false;
            if (state.filter === 'disabled' && job.status !== 'disabled') return false;
            if (state.filter === 'running' && !job.running) return false;
            if (!state.keyword) return true;
            return (
              (job.name + ' ' + job.prompt + ' ' + job.expr)
                .toLowerCase()
                .indexOf(state.keyword.toLowerCase()) !== -1
            );
          });
          list.sort(function (a, b) {
            if (state.sort === 'name') return a.name.localeCompare(b.name, 'zh-Hans-CN');
            if (state.sort === 'fires') return b.fireCount - a.fireCount;
            var av = a.status === 'disabled' || !a.nextFireAt ? Infinity : new Date(a.nextFireAt);
            var bv = b.status === 'disabled' || !b.nextFireAt ? Infinity : new Date(b.nextFireAt);
            return av - bv;
          });
          return list;
        }

        function historyBlock(job) {
          var entries = sd.historyFor(job.id);
          if (entries.length === 0) {
            return '<div class="muted" style="font-size:11.5px">暂无执行记录</div>';
          }
          return entries
            .map(function (entry) {
              return (
                '<div class="tl-entry"><div class="tl-line">' +
                '<span class="status ' +
                sd.resultClass(entry.status) +
                '">' +
                sd.resultLabel(entry.status) +
                '</span>' +
                '<span class="muted">' +
                sd.absTime(entry.startedAt) +
                ' · ' +
                sd.duration(entry.durationMs) +
                '</span>' +
                '</div>' +
                (entry.error
                  ? '<div class="tl-error" style="color:' +
                    (entry.status === 'skipped' ? 'var(--fg-muted)' : 'var(--complement)') +
                    '">' +
                    sd.escapeHtml(entry.error) +
                    '</div>'
                  : '') +
                (entry.outputPreview
                  ? '<div class="tl-output">' + sd.escapeHtml(entry.outputPreview) + '</div>'
                  : '') +
                '</div>'
              );
            })
            .join('');
        }

        function renderGrid() {
          var list = filtered();
          var host = document.getElementById('grid');
          if (list.length === 0) {
            host.innerHTML =
              '<div class="card empty" style="grid-column:1/-1">没有符合条件的任务</div>';
            return;
          }
          host.innerHTML = list
            .map(function (job) {
              var isDisabled = job.status === 'disabled';
              var countdown = isDisabled
                ? '<div class="countdown"><span class="countdown-value muted">已停用</span><span class="countdown-note">启用后重新排期</span></div>'
                : '<div class="countdown"><span class="countdown-value">' +
                  (job.nextFireAt ? sd.relative(job.nextFireAt) : '—') +
                  '</span><span class="countdown-note">' +
                  sd.absTime(job.nextFireAt) +
                  ' 执行</span></div>';

              return (
                '<article class="card job-card" data-id="' +
                job.id +
                '" data-disabled="' +
                isDisabled +
                '" data-running="' +
                Boolean(job.running) +
                '" data-history="' +
                Boolean(state.openHistory[job.id]) +
                '">' +
                '<div class="card-top">' +
                '<div style="min-width:0;flex:1">' +
                '<div class="card-name">' +
                sd.escapeHtml(job.name) +
                '</div>' +
                '<div class="card-prompt">' +
                sd.escapeHtml(job.prompt) +
                '</div>' +
                '</div>' +
                sd.statusBadge(job) +
                '</div>' +
                countdown +
                '<div class="card-meta">' +
                '<div><span class="muted">调度</span><span class="mono">' +
                sd.escapeHtml(job.expr) +
                '</span> ' +
                sd.kindTag(job) +
                '</div>' +
                '<div><span class="muted">上次结果</span>' +
                (job.lastResult
                  ? '<span class="status ' +
                    sd.resultClass(job.lastResult) +
                    '">' +
                    sd.resultLabel(job.lastResult) +
                    '</span> ' +
                    '<span class="muted" style="font-size:10.5px">' +
                    sd.absTime(job.lastFiredAt) +
                    '</span>'
                  : '<span class="muted">尚未执行</span>') +
                '</div>' +
                '<div><span class="muted">投递方式</span>' +
                sd.deliveryLabel(job.delivery) +
                (job.deliveryTarget ? ' · ' + sd.escapeHtml(job.deliveryTarget) : '') +
                '</div>' +
                '<div><span class="muted">累计运行</span>' +
                job.fireCount +
                ' 次</div>' +
                '</div>' +
                (job.lastResult === 'failed'
                  ? '<div class="tl-error" style="color:var(--complement)">' +
                    sd.escapeHtml(job.lastError || '未记录失败原因') +
                    '</div>'
                  : '') +
                '<div class="card-actions">' +
                '<button type="button" class="btn btn-accent" data-action="立即运行：' +
                sd.escapeHtml(job.name) +
                '"' +
                (job.running ? ' disabled' : '') +
                '>' +
                (job.running ? '运行中…' : '立即运行') +
                '</button>' +
                '<button type="button" class="btn ' +
                (isDisabled ? 'btn-success' : 'btn') +
                '" data-action="' +
                (isDisabled ? '启用' : '停用') +
                '：' +
                sd.escapeHtml(job.name) +
                '">' +
                (isDisabled ? '启用' : '停用') +
                '</button>' +
                '<button type="button" class="btn" data-toggle-history="' +
                job.id +
                '">历史</button>' +
                '<span class="spacer"></span>' +
                '<button type="button" class="btn btn-ghost btn-icon" title="删除任务" data-action="删除：' +
                sd.escapeHtml(job.name) +
                '">✕</button>' +
                '</div>' +
                '<div class="card-history">' +
                historyBlock(job) +
                '</div>' +
                '</article>'
              );
            })
            .join('');
        }

        function render() {
          renderKpis();
          renderGrid();
        }

        var toastTimer = null;
        function toast(text) {
          var node = document.getElementById('toast');
          node.textContent = text;
          node.dataset.show = 'true';
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () {
            node.dataset.show = 'false';
          }, 1600);
        }

        document.getElementById('q').addEventListener('input', function (event) {
          state.keyword = event.target.value.trim();
          render();
        });
        document.getElementById('sort').addEventListener('change', function (event) {
          state.sort = event.target.value;
          render();
        });
        document.getElementById('filter-chips').addEventListener('click', function (event) {
          var chip = event.target.closest('.chip');
          if (!chip) return;
          state.filter = chip.dataset.filter;
          Array.prototype.forEach.call(this.querySelectorAll('.chip'), function (node) {
            node.setAttribute('aria-pressed', String(node === chip));
          });
          render();
        });

        document.getElementById('grid').addEventListener('click', function (event) {
          var toggle = event.target.closest('[data-toggle-history]');
          if (toggle) {
            var id = toggle.dataset.toggleHistory;
            state.openHistory[id] = !state.openHistory[id];
            render();
            return;
          }
        });

        document.body.addEventListener('click', function (event) {
          var trigger = event.target.closest('[data-action]');
          if (trigger) toast(trigger.dataset.action);
        });

        render();
        sd.mountShell('c');
      })();
    </script>
  </body>
</html>

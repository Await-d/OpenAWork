# 按请求是否真的是 WS 升级来决定 Connection 头。
# 此前 /api/ 与 /sessions/ 无条件下发 `Connection: "upgrade"`，会让这两个前缀下
# **所有非 WS 请求**的 upstream 连接被当作待升级连接，从而打断 keepalive。
# 空串分支必须用 `''`（而非官方 WebSocket 示例里的 `close`）：`close` 同样会强制
# 关闭连接、继续打断 keepalive；空串让 nginx 不下发该头，配合下面的 upstream
# keepalive 才能真正复用连接。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream gateway_upstream {
    server gateway:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://gateway_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    location /auth/ {
        proxy_pass http://gateway_upstream/auth/;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    location /sessions/ {
        proxy_pass http://gateway_upstream/sessions/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}


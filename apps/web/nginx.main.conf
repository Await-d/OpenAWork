user  nginx;
worker_processes  auto;

# 每个 worker 可打开的 fd 上限。必须 ≥ worker_connections × 2：一个被代理的连接同时占用
# client 与 upstream 两个 fd。若只抬高 worker_connections 而不抬高这里，高峰期会先撞上
# "too many open files" 而不是配置里的连接数上限。
worker_rlimit_nofile  8192;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    # 镜像默认 1024。一个代理连接的 client+upstream 各占一个 fd，故实际并发代理连接数
    # 约为该值的一半（1024 → ~500）。本项目的长连接偏多：终端抽屉每个 pane 一条 SSE
    # （每会话最多 4 条，长期不释放），叠加端口页轮询、浏览器预览与普通 API 请求，
    # 1024 会先于 CPU 成为瓶颈。抬到 4096（约 2000 并发代理连接）。
    worker_connections  4096;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
